version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sta-postgres
    environment:
      POSTGRES_USER: sta_user
      POSTGRES_PASSWORD: sta_password
      POSTGRES_DB: sta_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
