<div class="font-headline text-xl tracking-tighter text-atelier-charcoal leading-none mb-2">Look 012</div>
<div class="font-label text-[9px] tracking-widest uppercase text-atelier-grey">Virgin Wool &amp; Silk Fusion</div>

</div>
