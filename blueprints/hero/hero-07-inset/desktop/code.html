<html><head></head><body><div class="hero-v17-wrapper">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;600&display=swap');
    
    .hero-v17-wrapper {
      --bg-color: #FDFCF8;
      --charcoal: #1A1A1A;
      background-color: var(--bg-color);
      color: var(--charcoal);
      font-family: 'Manrope', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .hero-v17-container {
      padding: 80px 0;
      overflow: hidden;
      position: relative;
      min-height: 800px;
      display: flex;
      align-items: center;
    }

    .hero-v17-heading {
      font-family: 'Noto Serif', serif;
      color: var(--charcoal);
    }

    .hero-v17-layout {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      height: 800px;
    }

    .hero-v17-main-frame {
      position: absolute;
      top: 0;
      right: 0;
      width: 75%;
      height: 100%;
      z-index: 1;
    }

    .hero-v17-inset-frame {
      position: absolute;
      bottom: -40px;
      right: 15%;
      width: 380px;
      height: 520px;
      z-index: 3;
      box-shadow: 40px 40px 80px rgba(0, 0, 0, 0.1);
    }

    .hero-v17-text-box {
      position: absolute;
      top: 15%;
      left: 5%;
      z-index: 4;
      background: rgba(253, 252, 248, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 64px;
      max-width: 580px;
      border: 1px solid rgba(26, 26, 26, 0.05);
    }

    .hero-v17-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.5);
      margin-bottom: 24px;
      display: block;
    }

    .hero-v17-button {
      background-color: var(--charcoal);
      color: var(--bg-color);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 20px 48px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .hero-v17-button:hover {
      opacity: 0.9;
    }

    .hero-v17-inset-label {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 10px;
      color: white;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      padding: 6px 16px;
    }

    @media (max-width: 1024px) {
      .hero-v17-text-box {
        max-width: 480px;
        padding: 48px;
      }
      .hero-v17-inset-frame {
        width: 300px;
        height: 400px;
        right: 10%;
      }
    }

    @media (max-width: 768px) {
      .hero-v17-container {
        padding: 40px 20px;
        min-height: auto;
      }
      .hero-v17-layout {
        height: auto;
        display: flex;
        flex-direction: column;
      }
      .hero-v17-main-frame {
        position: relative;
        width: 100%;
        height: 400px;
        margin-bottom: 32px;
      }
      .hero-v17-text-box {
        position: relative;
        top: 0;
        left: 0;
        padding: 32px 0;
        max-width: 100%;
        background: transparent;
        border: none;
        backdrop-filter: none;
      }
      .hero-v17-inset-frame {
        display: none;
      }
      .hero-v17-heading {
        font-size: 48px;
      }
    }
  </style>
<div class="hero-v17-container">

</div>
