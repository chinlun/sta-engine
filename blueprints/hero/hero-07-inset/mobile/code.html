    .hero-v17-wrapper {

      text-align: center;
      order: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-v17-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.5);
      margin-bottom: 20px;
      display: block;
    }

    .hero-v17-paragraph {
      font-size: 16px;
      color: rgba(26, 26, 26, 0.8);
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 320px;
      text-align: center;
    }

    .hero-v17-button {
      background-color: var(--charcoal);
      color: var(--bg-color);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 18px 40px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: fit-content;
    }

    .hero-v17-inset-frame {
      width: 100%;
      height: 400px;
      position: relative;
      order: 3;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    .hero-v17-inset-label {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 9px;
      color: white;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px 12px;
    }
