<html><head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@300;400;500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  }
  .hero-variant-16-mobile {
    font-family: 'Manrope', sans-serif;
    background-color: #FDFCF8;
  }
  .hero-variant-16-mobile h1, 
  .hero-variant-16-mobile h2, 
  .hero-variant-16-mobile h3,
  .hero-variant-16-mobile .font-serif-quote {
    font-family: 'Noto Serif', serif;
  }
</style>
</head>
<body class="margin-0 padding-0">
<!-- Hero Variant 16: The Duo-Tone (Mobile Optimized) -->
<div class="hero-variant-16-mobile overflow-hidden min-h-screen flex flex-col">
<section class="flex flex-col flex-1">
<!-- Top Block: High-Contrast Dark Block (Content) -->
<div class="w-full bg-[#1A1A1A] flex flex-col items-center justify-center px-6 py-[40px] text-center order-1">
<div class="max-w-md w-full">
<span class="block font-sans text-[10px] tracking-[0.3em] text-[#A1A1A1] uppercase mb-6">Autumn / Winter 2024</span>
<h1 class="text-5xl text-[#FDFCF8] leading-tight mb-8">
          The <br/><span class="italic">Modern</span><br/> Silhouette
        </h1>
<p class="text-[#A1A1A1] text-sm leading-relaxed mb-10 mx-auto max-w-xs">
          A study in architectural tailoring and the quiet confidence of monochrome textures. Crafted for the digital artisan.
        </p>
<div class="flex flex-col gap-4 w-full px-4">
<button class="bg-[#FDFCF8] text-[#1A1A1A] w-full py-4 text-xs tracking-widest uppercase transition-all duration-300 active:opacity-80">
            Explore Collection
          </button>
<button class="border border-[#FDFCF8]/30 text-[#FDFCF8] w-full py-4 text-xs tracking-widest uppercase transition-all duration-300 active:bg-[#FDFCF8]/10">
            View Film
          </button>
</div>
</div>
</div>
<!-- Bottom Block: Light Imagery Block -->
<div class="w-full bg-[#FDFCF8] flex flex-col items-center justify-center px-6 py-[40px] relative order-2">
<div class="w-full relative aspect-[4/5] max-w-sm">
<img alt="High-fashion editorial portrait" class="w-full h-full object-cover grayscale brightness-95 contrast-105" data-alt="Editorial fashion photography of a model in a sharp charcoal wool coat against a minimal stone background, high-contrast lighting, avant-garde pose" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOPGpj2NZY-jiQ83xWP_GdFS2HHynUVYLSnW7_-DtE_6vb05s0PBM0luB9j19_5F6mtVdvNOYvHmYzout_86uAEFBouaz3TcHp4mksb74QaLoo-tTzsqj_SfQSd7n8yuZ61-Ydg7nD-qOpS0yTGJwMB82yZvqJoTl_7zId-71Z3u34a33HWPb9nTXNOUxuywkMr3Csg7kYe4JOy67pzdGfrObyWPuF-hB5XNYbvQchYQSNZoKBvj6grq9nIfck_d73h03wDruYrTk"/>
<!-- Mobile Centered Quote Label -->
<div class="mt-8 bg-white/50 backdrop-blur-sm p-8 text-center border border-[#1A1A1A]/5 shadow-sm">
<p class="font-serif-quote text-xl text-[#1A1A1A] leading-snug italic">"True luxury is found in the absence of noise."</p>
<div class="mt-4 flex items-center justify-center gap-3">
<span class="w-6 h-[1px] bg-[#1A1A1A]/20"></span>
<span class="font-sans text-[10px] tracking-widest uppercase text-[#5f5e5e]">Atelier Philosophy</span>
<span class="w-6 h-[1px] bg-[#1A1A1A]/20"></span>
</div>
</div>
</div>
</div>
</section>
</div>
</body></html>
