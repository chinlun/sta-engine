<html><head><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Manrope:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  #hero-variant-20-mobile {
    background-color: #FDFCF8; /* Quiet Luxury Background */
    padding: 40px 0; /* Reduced vertical padding for mobile */
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
    color: #1A1A1A; /* Quiet Luxury Text */
  }

  .atelier-container {
    padding: 0 24px; /* Mobile margins */
  }

  .mobile-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .text-block {
    order: 2; /* Text after image for mobile layout flow */
    width: 100%;
    margin-top: 40px;
  }

  .image-block {
    order: 1; /* Image first for mobile impact */
    width: 100%;
    background-color: #f4f4ef;
    padding: 20px;
    position: relative;
  }

  .image-wrapper {
    aspect-ratio: 4/5;
    width: 100%;
    overflow: hidden;
    position: relative;
  }

  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .eyebrow {
    font-family: 'Manrope', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #5f5e5e;
    margin-bottom: 20px;
    display: block;
  }

  .display-title {
    font-family: 'Noto Serif', serif;
    font-size: 2.75rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #1A1A1A;
    margin: 0;
  }

  .description {
    font-family: 'Manrope', sans-serif;
    font-size: 0.9375rem;
    line-height: 1.6;
    color: #4A4A4A;
    margin-top: 24px;
    max-width: 100%;
  }

  .cta-link {
    display: inline-flex;
    align-items: center;
    margin-top: 40px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #1A1A1A;
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: opacity 0.3s ease;
  }

  .cta-link span {
    margin-left: 6px;
    font-size: 16px;
  }

  /* Hidden on mobile to keep clean "Quiet Luxury" aesthetic as per constraints */
  .floating-detail {
    display: none;
  }
</style>
</head><body><div id="hero-variant-20-mobile">
<div class="atelier-container">
<div class="mobile-stack">
<!-- Image Section (Stacked Top) -->
<div class="image-block">
<div class="image-wrapper">
<img alt="Minimalist fashion photography" data-alt="High-end editorial fashion shot of a woman in a structural beige wool coat standing against a minimalist limestone wall with sharp sunlight shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC88sAdGRgfs8k5J5RoQwLt3dAHLsr0oIzDrZDOCBEZfeHdAzgZ20LqoPN0fp-2jNW0E2fsJCaSusW7kkPlsjb4HO0S5QqDGo7qQcZ_6HSB6l19nY9U9qC-_pkhgK6TDk0FUa3hiKFr1T6rDtx0bArBwOcwKhJVHsSQZSy1G0Cioik6_Sj9ja2GVo0DrNduDk2d78D8X8szKhla8tMch8JqIM-BpS_RQB2tnTmrbO1NVffj2iP21-XCYZ_RTVvMJ2Rd33-0xY1EEzY"/>
</div>
</div>
<!-- Heading Section (Stacked Bottom) -->
<div class="text-block">
<span class="eyebrow">Autumn / Winter 2024</span>
<h1 class="display-title">
          Structural<br/>Softness
        </h1>
<p class="description">
          An exploration of architectural silhouettes rendered in fluid, organic fabrics. Designed for the modern observer who values the quiet dialogue between form and material.
        </p>
<a class="cta-link" href="#">
          EXPLORE THE COLLECTION
          <span class="material-symbols-outlined">north_east</span>
</a>
</div>
</div>
</div>
</div></body></html>
